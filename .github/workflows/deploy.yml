name: Deploy Galiyaara

# Push a photograph into photos/ and it is hanging in the corridor a minute later.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # A free tier cannot describe a hundred photographs in one allowance window,
  # so the curator chips away at the backlog once a day until it is done. When
  # there is nothing left to look at the run exits in seconds.
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write   # the curator commits photos/curation.json back
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A free vision model looks at each newly-added photograph once and writes
      # its title, caption, alt text and tags, then re-hangs the show. The result
      # is committed back, so it is done once and inherited by every fork.
      # With no key set this step is a no-op and the build falls back to
      # filename titles — a fork with no key still deploys.
      - name: Curate new photographs
        if: github.repository == 'ni-sh-a-char/Galiyaara'
        env:
          # Set whichever ONE you have as a repository secret. All free tiers.
          # First key present wins, in this order.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Optional repository *variable*, for when a free model ID is retired.
          GALIYAARA_AI_MODEL: ${{ vars.GALIYAARA_AI_MODEL }}
        run: npm run curate

      - name: Commit the curation
        if: github.repository == 'ni-sh-a-char/Galiyaara'
        run: |
          if [ -n "$(git status --porcelain photos/curation.json)" ]; then
            git config user.name  "galiyaara-curator[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add photos/curation.json
            git commit -m "Curate new photographs [skip ci]"
            git push
          fi

      # Skip re-encoding photographs that haven't changed since the last deploy.
      - uses: actions/cache@v4
        with:
          path: dist/photos
          key: photo-derivatives-${{ hashFiles('photos/**') }}
          restore-keys: photo-derivatives-

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
