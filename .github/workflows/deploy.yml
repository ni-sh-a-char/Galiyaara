name: Deploy Galiyaara

# Push a photograph into photos/ and it is hanging in the corridor a minute later.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # the curator commits photos/curation.json back
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Claude looks at any newly-added photograph once and writes its title,
      # caption, alt text and tags, then re-hangs the show. The result is
      # committed back, so it is paid for once and inherited by every fork.
      # Without the secret this step is a no-op and the build falls back to
      # filename titles — a fork with no key still deploys.
      - name: Curate new photographs
        if: github.repository == 'ni-sh-a-char/Galiyaara'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run curate

      - name: Commit the curation
        if: github.repository == 'ni-sh-a-char/Galiyaara'
        run: |
          if [ -n "$(git status --porcelain photos/curation.json)" ]; then
            git config user.name  "galiyaara-curator[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add photos/curation.json
            git commit -m "Curate new photographs [skip ci]"
            git push
          fi

      # Skip re-encoding photographs that haven't changed since the last deploy.
      - uses: actions/cache@v4
        with:
          path: dist/photos
          key: photo-derivatives-${{ hashFiles('photos/**') }}
          restore-keys: photo-derivatives-

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
